name: Deploy

on:
  push:
    branches: [ develop ]

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Deploy
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Build site
      run: npm run build

    - name: Deploy
      uses: crazy-max/ghaction-github-pages@v1
      with:
        target_branch: master
        build_dir: dist
        allow_empty_commit: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Wait for GitHub Pages
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        echo "Waiting for pages-build-deployment after $since"
        for i in $(seq 1 30); do
          runs=$(gh run list \
            --workflow=pages-build-deployment \
            --branch=master \
            --limit 5 \
            --json status,conclusion,createdAt)
          echo "$runs" | jq -c '.[]'
          if echo "$runs" | jq -e --arg since "$since" \
            '[.[] | select(.createdAt >= $since and .conclusion == "failure")] | length > 0' >/dev/null; then
            echo "GitHub Pages build failed"
            exit 1
          fi
          if echo "$runs" | jq -e --arg since "$since" \
            '[.[] | select(.createdAt >= $since and .status == "completed" and .conclusion == "success")] | length > 0' >/dev/null; then
            echo "GitHub Pages is live"
            sleep 15
            exit 0
          fi
          sleep 10
        done
        echo "Timed out waiting for GitHub Pages; purging Cloudflare anyway"

    - name: Clear cache
      run: |
        curl -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
          -H "X-Auth-Email: $CF_API_EMAIL" \
          -H "X-Auth-Key: $CF_API_KEY" \
          -H "Content-Type: application/json" \
          --data '{"purge_everything":true}'
      env:
        CF_ZONE: ${{ secrets.CF_ZONE }}
        CF_API_EMAIL: ${{ secrets.CF_API_EMAIL }}
        CF_API_KEY: ${{ secrets.CF_API_KEY }}
